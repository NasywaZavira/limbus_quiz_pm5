name: limbus_quiz_pm5
description: "Project Quiz Pilihan Ganda untuk Ujian Tengah Semester Praktikum Pemograman Mobile"

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/images/


  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Thin.ttf
          weight: 100
        - asset: assets/fonts/Barlow-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Barlow-Light.ttf
          weight: 300
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
        - asset: assets/fonts/Barlow-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Barlow-Black.ttf
          weight: 900
        - asset: assets/fonts/Barlow-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Barlow-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Barlow-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Barlow-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Barlow-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Barlow-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Barlow-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Barlow-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Barlow-BlackItalic.ttf
          weight: 900
          style: italic
    - family: Teko
      fonts:
        - asset: assets/fonts/Teko-VariableFont_wght.ttf
